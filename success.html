<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أعراف | تأكيد الاشتراك</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --navy:#1B3A4B;
      --navy-light:#234D63;
      --gold:#C9A96E;
      --bg:#FAFAF7;
      --card:#FFFFFF;
      --text:#1B2B36;
      --muted:#6B7C88;
      --border:rgba(27,58,75,.08);
      --shadow:0 10px 30px rgba(27,58,75,.08);
      --ok:#16A34A;
      --bad:#DC2626;
    }
    body{
      font-family:'Tajawal',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      width:100%;
      max-width:640px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:32px 24px;
      text-align:center;
    }
    .title{
      font-family:'Cairo',sans-serif;
      font-size:28px;
      font-weight:800;
      color:var(--navy);
      margin-bottom:12px;
    }
    .message{
      font-size:15px;
      line-height:1.9;
      color:var(--muted);
      margin-bottom:22px;
    }
    .status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 16px;
      border-radius:999px;
      margin-bottom:20px;
      font-weight:700;
      font-size:14px;
    }
    .status.loading{
      background:rgba(27,58,75,.08);
      color:var(--navy);
    }
    .status.success{
      background:rgba(22,163,74,.08);
      color:var(--ok);
    }
    .status.error{
      background:rgba(220,38,38,.08);
      color:var(--bad);
    }
    .btn{
      display:inline-block;
      padding:14px 22px;
      border-radius:14px;
      text-decoration:none;
      border:none;
      background:linear-gradient(135deg,var(--navy),var(--navy-light));
      color:#f3dfb4;
      font-family:'Cairo',sans-serif;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }
    .small{
      margin-top:16px;
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">تأكيد الاشتراك</h1>

    <div id="statusBox" class="status loading">جارٍ التحقق من عملية الدفع...</div>

    <p id="messageBox" class="message">
      نتحقق الآن من بيانات العملية ونفعّل اشتراكك في منصة أعراف.
    </p>

    <a id="goBtn" class="btn" href="index.html" style="display:none;">الدخول إلى المنصة</a>

    <div class="small">يرجى عدم إغلاق الصفحة حتى يكتمل التحقق.</div>
  </div>

  <script>
    async function verifyPaymentFromUrl() {
      const params = new URLSearchParams(window.location.search);

      const paymentId =
        params.get('id') ||
        params.get('payment_id');

      const statusBox = document.getElementById('statusBox');
      const messageBox = document.getElementById('messageBox');
      const goBtn = document.getElementById('goBtn');

      if (!paymentId) {
        statusBox.className = 'status error';
        statusBox.textContent = 'تعذر العثور على رقم العملية';
        messageBox.textContent = 'لم يصلنا payment_id من رابط العودة. تأكد من إعداد callback_url بشكل صحيح.';
        return;
      }

      try {
        const res = await fetch('/api/verify-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            payment_id: paymentId
          })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          statusBox.className = 'status error';
          statusBox.textContent = 'تعذر تفعيل الاشتراك';
          messageBox.textContent = data.error || 'فشل التحقق من عملية الدفع.';
          return;
        }

        statusBox.className = 'status success';
        statusBox.textContent = 'تم تفعيل الاشتراك بنجاح';
        messageBox.textContent = 'تم تأكيد الدفع وتفعيل اشتراكك بنجاح. يمكنك الآن الدخول إلى المنصة.';
        goBtn.style.display = 'inline-block';
        goBtn.href = 'index.html';
      } catch (error) {
        statusBox.className = 'status error';
        statusBox.textContent = 'حدث خطأ غير متوقع';
        messageBox.textContent = error.message || 'تعذر إكمال التحقق.';
      }
    }

    verifyPaymentFromUrl();
  </script>
</body>
</html>
