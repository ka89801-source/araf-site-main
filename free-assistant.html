<header class="mast"><div class="mast-inner">
  <a class="brand" href="services.html" aria-label="أعراف، الخدمات"><img src="logo.png" alt=""><b>أعراف</b></a>
  <h1>المساعد القانوني الذكي</h1>
  <button id="restart" type="button" class="quiet" hidden>محادثة جديدة</button>
</div></header>
<main id="scroll" aria-label="المحادثة" tabindex="0">
  <div class="thread">
    <div id="log" role="log" aria-label="رسائل المحادثة" aria-live="polite" aria-relevant="additions"></div>
    <div id="working" class="working" role="status" hidden><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="activity"></span></div>
    <div id="failure" hidden><p id="error" role="alert"></p><button type="button" id="retry">إعادة المحاولة</button> <button type="button" id="revise">تعديل رسالتي</button></div>
  </div>
</main>
<div class="dock">
  <button id="latest" type="button" hidden>أحدث رسالة ↓</button>
  <form id="composer" hidden>
    <div id="actions" hidden><div id="choices"></div><button type="button" class="quiet" id="skip">أكمل التحليل بالمتاح</button></div>
    <div id="file-info" hidden><span id="filename"></span><button type="button" id="remove">إزالة</button></div>
    <div class="input-box">
      <button type="button" id="attach" class="icon" hidden aria-label="إرفاق مستند نصي TXT" title="إرفاق مستند نصي TXT"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 13 6-6a2.5 2.5 0 0 1 3.5 3.5l-8 8A4.5 4.5 0 0 1 3 12l9-9a5.5 5.5 0 0 1 8 8l-8 8"/></svg></button>
      <input id="attachment" type="file" accept=".txt,text/plain" hidden>
      <label class="sr" for="entry">رسالتك إلى مساعد أعراف</label><textarea id="entry" rows="1" maxlength="8000" placeholder="اكتب مسألتك بطريقتك…" required></textarea>
      <button class="send icon" aria-label="إرسال الرسالة" title="إرسال"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
    </div>
    <small id="consent">يُعالَج وصفك آليًا. <a href="terms.html" target="_blank" rel="noopener">الشروط وحماية البيانات</a></small>
  </form>
  <div id="notice" role="status"></div>
</div>
<dialog id="reset-dialog"><h2>بدء محادثة جديدة؟</h2><p>ستُمسح رسائل هذه الجلسة من الصفحة.</p><form method="dialog"><button value="cancel" autofocus>البقاء هنا</button><button value="reset">بدء محادثة جديدة</button></form></dialog>
<noscript>يحتاج المساعد إلى تفعيل جافاسكريبت لبدء المحادثة.</noscript>
</body></html>
