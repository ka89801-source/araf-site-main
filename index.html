<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أعراف — منصة الخدمات القانونية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FBF9F3;
  --ivory-deep:#F4EFE4;
  --gold:#C6A15B;
  --gold-soft:#E7D9BC;
  --navy:#1C3450;
  --navy-soft:#4A617C;
  --dur-logo:1.5s;
  --ease-settle:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:var(--ivory);
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
}

/* ── الخلفية ───────────────────────────── */
.bg{
  position:fixed;inset:0;
  background:
    radial-gradient(120vmax 90vmax at 50% 42%, #FFFFFF 0%, var(--ivory) 46%, var(--ivory-deep) 100%);
  opacity:0;
  animation:bgIn 1.3s ease-out .05s forwards;
}
@keyframes bgIn{to{opacity:1}}

/* شعاع أفقي رقيق خلف الشعار */
.horizon{
  position:fixed;top:46%;left:50%;
  width:min(78vw,720px);height:1px;
  transform:translate(-50%,-50%) scaleX(0);
  background:linear-gradient(90deg,transparent, var(--gold-soft) 30%, var(--gold) 50%, var(--gold-soft) 70%, transparent);
  opacity:.5;
  animation:horizon 1.4s var(--ease-settle) .5s forwards;
}
@keyframes horizon{to{transform:translate(-50%,-50%) scaleX(1)}}

/* جزيئات ذهبية هادئة */
.dust{position:fixed;inset:0;pointer-events:none}
.dust span{
  position:absolute;
  width:4px;height:4px;border-radius:50%;
  background:var(--gold);
  opacity:0;
  animation:dustFloat var(--t,9s) ease-in-out var(--d,1s) infinite,
            dustIn 1.6s ease-out var(--d,1s) forwards;
}
@keyframes dustIn{to{opacity:var(--o,.25)}}
@keyframes dustFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-26px)}
}

/* ── المسرح ───────────────────────────── */
.stage{
  position:relative;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:clamp(26px,4.4vmin,40px);
  transition:transform 1.2s var(--ease-settle);
}
.ready .stage{transform:translateY(-8px)}

/* ── الشعار ───────────────────────────── */
.emblem{
  position:relative;
  width:clamp(180px,36vmin,264px);
  aspect-ratio:680/740;
}

/* توهج ذهبي خلف الشعار */
.emblem::before{
  content:"";
  position:absolute;inset:-34%;
  background:radial-gradient(circle at 50% 46%, rgba(198,161,91,.30) 0%, rgba(198,161,91,.10) 42%, transparent 70%);
  opacity:0;filter:blur(6px);
  animation:glowIn 1.1s ease-out 1.35s forwards;
}
.ready .emblem::before{
  animation:breathe 4.5s ease-in-out infinite;
}
@keyframes glowIn{to{opacity:1}}
@keyframes breathe{
  0%,100%{opacity:.75;transform:scale(1)}
  50%{opacity:1;transform:scale(1.045)}
}

.logo-wrap{
  position:relative;width:100%;height:100%;
  opacity:0;
  transform:translateY(42px) scale(.9) rotate(-5deg);
  animation:logoRise var(--dur-logo) var(--ease-settle) .18s forwards;
  will-change:transform,opacity;
}
@keyframes logoRise{
  60%{opacity:1}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
}
.logo-wrap img{
  display:block;width:100%;height:100%;
  filter:drop-shadow(0 18px 34px rgba(28,52,80,.14));
}

/* لمعة ضوئية تعبر الشعار — مقنّعة بشكل الشعار نفسه */
.sheen{
  position:absolute;inset:0;
  background:linear-gradient(115deg,
    transparent 32%,
    rgba(255,255,255,.0) 42%,
    rgba(255,248,232,.85) 50%,
    rgba(255,255,255,.0) 58%,
    transparent 68%);
  background-size:280% 100%;
  background-position:130% 0;
  -webkit-mask-image:var(--logo-url);
  mask-image:var(--logo-url);
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;
  mix-blend-mode:soft-light;
  animation:sheenSweep 1.15s cubic-bezier(.45,.05,.35,1) 1.55s forwards;
  opacity:0;
}
@keyframes sheenSweep{
  0%{opacity:1;background-position:130% 0}
  100%{opacity:0;background-position:-130% 0}
}

/* انعكاس خفيف أسفل الشعار */
.reflection{
  position:absolute;top:calc(100% + 6px);left:0;
  width:100%;height:52%;
  background-image:var(--logo-url);
  background-size:100% auto;
  background-position:top center;
  background-repeat:no-repeat;
  transform:scaleY(-1);
  opacity:0;
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.5),transparent 78%);
  mask-image:linear-gradient(to top,rgba(0,0,0,.5),transparent 78%);
  animation:reflIn 1s ease-out 1.75s forwards;
  pointer-events:none;
}
@keyframes reflIn{to{opacity:.10}}

/* ── اسم المنصة ───────────────────────── */
.wordmark{
  display:flex;flex-direction:column;
  align-items:center;gap:16px;
}
.rule{
  width:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:ruleGrow .75s var(--ease-settle) 2.15s forwards;
}
@keyframes ruleGrow{to{width:clamp(120px,22vmin,180px)}}

.tagline{
  display:flex;gap:.34em;
  font-size:clamp(1.06rem,2.9vmin,1.45rem);
  font-weight:500;
  color:var(--navy);
  letter-spacing:.01em;
}
.tagline .w{
  opacity:0;
  transform:translateY(14px);
  animation:wordIn .8s var(--ease-settle) forwards;
  animation-delay:calc(2.35s + var(--i) * .13s);
}
.tagline .brand{color:var(--gold);font-weight:600}
@keyframes wordIn{
  to{opacity:1;transform:translateY(0)}
}

/* ── العبارة الثانية (تدخل مكان الأولى) ── */
.wordmark{position:relative}
.subline{
  position:absolute;
  top:17px; /* بعد الخط الذهبي وفجوة 16px لتطابق موضع العنوان */
  inset-inline:0;
  text-align:center;
  white-space:nowrap;
  font-size:clamp(1.06rem,2.9vmin,1.45rem);
  font-weight:500;
  color:var(--navy);
  letter-spacing:.01em;
  opacity:0;
  pointer-events:none;
}
.subline .brand{color:var(--gold);font-weight:600}

/* التبديل المسحوب: العنوان يُسحب لليسار والعبارة الجديدة تنسحب من اليمين */
.swap .tagline{
  animation:tagOut .75s var(--ease-settle) forwards;
}
@keyframes tagOut{
  to{opacity:0;transform:translateX(-44px);filter:blur(5px)}
}
.swap .subline{
  animation:subIn .9s var(--ease-settle) .32s forwards;
}
@keyframes subIn{
  from{opacity:0;transform:translateX(50px);filter:blur(5px)}
  to{opacity:1;transform:translateX(0);filter:blur(0)}
}

/* ── إمكانية الوصول والحركة المخفّضة ───── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .bg{opacity:1}
  .horizon{transform:translate(-50%,-50%) scaleX(1)}
  .logo-wrap{opacity:1;transform:none}
  .emblem::before{opacity:1}
  .sheen{display:none}
  .reflection{opacity:.10}
  .rule{width:clamp(120px,22vmin,180px)}
  .tagline .w{opacity:1;transform:none}
  .swap .tagline{opacity:0;animation:none}
  .swap .subline{opacity:1;animation:none}
  .dust span{opacity:var(--o,.25)}
}

/* شاشات قصيرة جدًا بالعرض الأفقي على الجوال */
@media (max-height:460px){
  .emblem{width:clamp(120px,30vmin,180px)}
  .stage{gap:18px}
  .reflection{display:none}
}
</style>
</head>

(function(){

  /* استخدام صورة الشعار في اللمعة والانعكاس */
  var logo = document.querySelector('.logo-wrap img');

  if(logo){
    var src = logo.getAttribute('src');

    document.documentElement.style.setProperty(
      '--logo-url',
      'url("' + src + '")'
    );
  }

  var reducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  /* استقرار الشعار */
setTimeout(function(){
  document.body.classList.add('ready');
}, reducedMotion ? 300 : 2200);

/* تغيير العبارة أسفل الشعار بصورة أسرع */
setTimeout(function(){
  document.body.classList.add('swap');
}, reducedMotion ? 700 : 3600);

/* الخروج الناعم ثم الانتقال إلى الصفحة التعريفية */
setTimeout(function(){

  document.body.style.transition = 'opacity .4s ease';
  document.body.style.opacity = '0';

  setTimeout(function(){
    window.location.replace('home.html');
  }, 400);

}, reducedMotion ? 1300 : 5000);

})();
</script>
</body>
</html>
